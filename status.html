<html>
  <head>
    <title>status</title>
  </head>
    <body>
    <h1>server status</h1>
    <br>
    <br>

    <script>
      fetch('https://api.mcstatus.io/v2/status/java/womanly-renewable.gl.joinmc.link')
        .then(response => response.json())
        .then(data => {
          const statusDiv = document.getElementById('online');
          if (data === 1) {  // 1 = offline
            statusDiv.textContent = 'Offline';
          } else if (data === 0) {  // 0 = online
            statusDiv.textContent = 'Online';
          }
        })
        .catch(() => {
          document.getElementById('online').textContent = 'Offline';
        });
    </script>
    <div id="online"></div>
  </body>
</html>
